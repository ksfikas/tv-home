# Builds the launcher APK on every push. Tag a commit v* to publish it as a GitHub Release.
# Signing: set the repository secrets SIGNING_KEYSTORE_B64 (base64 of the keystore),
# SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD so CI builds can update an
# installed copy. Without them the APK is signed with a throwaway debug key.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          echo "TVHOME_KEYSTORE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"

      # Unit tests and Android lint first: a failure stops the build, so no broken APK is released.
      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew :launcher:testReleaseUnitTest :launcher:lintRelease --console=plain

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            launcher/build/reports/tests/
            launcher/build/reports/lint-results-release.html

      - name: Build
        env:
          TVHOME_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          TVHOME_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          TVHOME_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :launcher:assembleRelease --console=plain
          cp launcher/build/outputs/apk/release/launcher-release.apk tv-home.apk

      - uses: actions/upload-artifact@v7
        with:
          name: tv-home-apk
          path: tv-home.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" tv-home.apk --title "$GITHUB_REF_NAME" --generate-notes
