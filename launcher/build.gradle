plugins {
    id "com.android.application"
}

android {
    namespace "io.github.ksfikas.tvhome"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.ksfikas.tvhome"
        minSdk 30
        targetSdk 30
        versionCode 8
        versionName "3.0.3-tvh"
    }

    // Keep the original flat layout: launcher/{AndroidManifest.xml,src,res,assets}.
    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            java.srcDirs = ["src"]
            res.srcDirs = ["res"]
            assets.srcDirs = ["assets"]
        }
        test {
            java.srcDirs = ["test"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        // Media3's @UnstableApi opt-in check is Kotlin-oriented; plain Java callers trip it.
        disable "UnsafeOptInUsageError"
        // Sideloaded, never published to Play; targetSdk 30 matches the original launcher.
        disable "ExpiredTargetSdkVersion"
        // It's the Home screen (category HOME), deliberately not an app in the TV's app list.
        disable "MissingLeanbackLauncher"
    }

    // Sideloaded, so any stable key works; what matters is that every build uses the same one, or an
    // update won't install over the previous version. CI passes the key in through these variables
    // (from repository secrets); local builds without them use this machine's debug key.
    signingConfigs {
        release {
            def ks = System.getenv("TVHOME_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("TVHOME_KEYSTORE_PASSWORD")
                keyAlias System.getenv("TVHOME_KEY_ALIAS")
                keyPassword System.getenv("TVHOME_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            signingConfig System.getenv("TVHOME_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    // Live TV playback (hardware decoding through MediaCodec). No UI module: the player draws on a plain SurfaceView.
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    // QR code for pairing the phone remote (only the encoder survives shrinking).
    implementation "com.google.zxing:core:3.5.4"

    // Unit tests (JVM, run in CI). Android's org.json is a stub off-device, so tests use the real one.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20260814"
    testImplementation "net.sf.kxml:kxml2:2.3.0"   // an XmlPullParser for the news-feed tests (Android's is a stub off-device)
}
